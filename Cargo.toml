[package]
name = "L2_11"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41.0", features = ["full"] }
axum = { version = "0.7.0", features = ["macros"] }
chrono = { version = "0.4.30", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "chrono"] }
dotenv = "0.15.0"
serde = "1.0.210"
serde_json = "1.0.40"
tower = "0.5.0"
log = "0.4"
log4rs = "1.2"